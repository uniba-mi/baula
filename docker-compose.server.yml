services:
  server:
    build:
      context: ./server/
      dockerfile: Dockerfile
    restart: always   
    environment:
      - HOST_URL=${HOST_URL}
      - HOSTNAME=${HOSTNAME} 
    ports:    
      - "141.13.235.13:${SERVER_PORT}:80"
      - "141.13.235.13:${SERVER_PORT_SSL}:443"
    volumes:
      - ./server/app:/var/www   
      - ./server/apache2/sites-available:/etc/apache2/sites-available   
      - ./server/apache2/apache2.conf:/etc/apache2/apache2.conf
      - /etc/acme/rsa-certs:/etc/acme/rsa-certs

  rest_api:
    build: ./backend/api
    restart: always
    volumes:
      - ./backend/api/dist/interfaces:/api/interfaces
      - ./backend/api/dist/backend/api/src:/api/backend/src
      - ./backend/api/staticdata:/api/backend/staticdata
      - ./backend/api/package.json:/api/backend/package.json
      - ./backend/api/pm2.config.js:/api/backend/pm2.config.js

    ports:    
      - "141.13.235.13:3000:3305"