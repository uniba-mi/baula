services:
  server:
    build:
      context: ./server/
      dockerfile: Dockerfile
    restart: always   
    environment:
      - HOST_URL=${HOST_URL}
      - HOSTNAME=${HOSTNAME} 
    ports:    
      - "141.13.235.13:${SERVER_PORT}:80"
      - "141.13.235.13:${SERVER_PORT_SSL}:443"
    volumes:
      - ./server/app:/var/www   
      - ./server/apache2/sites-available:/etc/apache2/sites-available   
      - ./server/apache2/apache2.conf:/etc/apache2/apache2.conf
      - /etc/acme/rsa-certs:/etc/acme/rsa-certs

  rest_api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./backend/api/staticdata:/api/staticdata
      - ./backend/api/package.json:/api/package.json
      - ./backend/api/pm2.config.js:/api/pm2.config.js
      - ./backend/api/environment:/api/environment
      - ./backend/api/src/certs:/api/src/certs
      - ./backend/api/src/database:/api/src/database
      - ./backend/api/dist/backend/api/src:/api/src
      - ./backend/api/dist/interfaces:/interfaces
    ports:    
      - "141.13.235.13:${API_PORT}:3305"