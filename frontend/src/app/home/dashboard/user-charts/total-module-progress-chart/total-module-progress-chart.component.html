@if (modulProgressData) {
  <mat-card-content>
    @if (noDataMessage) {
      <canvas baseChart [data]="modulProgressData" [options]="moduleProgressOptions"
        [type]="'bar'" [legend]="false">
      </canvas>
    } @else {
      <app-no-data [diagram]=true noDataBtnText="Studienverlauf aus FlexNow laden" noDataLinkText="/app/profil/integrationen-verwalten" i18n-noDataBtnText></app-no-data>
    }
  </mat-card-content>
}
