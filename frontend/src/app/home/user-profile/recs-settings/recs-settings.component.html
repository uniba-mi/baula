<!-- RECOMMENDATION SETTINGS -->
<ng-container *ngIf="user$ | async as user">
    <div *ngIf="notInterestingModules$ | async as notInterestingModules">
        <div class="row mb-2">
            <div class="col">
                <h3 class="text-sm-start">Von Empfehlungen ausgeschlossene Module</h3>
            </div>
            <div class="col text-end" *ngIf="notInterestingModules.length">
                <button class="btn btn-secondary me-2" (click)="deleteNotInterestingModules()"
                    (keyup.enter)="deleteNotInterestingModules()">
                    Liste leeren
                </button>
            </div>
        </div>
        <div class="row">
            <div class="module-cards-container" *ngIf="notInterestingModules.length; else noData">
                <!-- todo: refactor -->
                <mat-card class="module-card p-4" *ngFor="let module of notInterestingModules"
                    (click)="openModuleDetails(module)" (keyup.enter)="openModuleDetails(module)">
                    <div class="fw-bold text-gray">{{ module.acronym }}</div>
                    <div>{{ module.name }}</div>
                    <button class="btn-icon position-absolute top-0 end-0" role="button" tabindex="0"
                        aria-label="Modul aus der Liste entfernen" (click)="deleteModule($event, module.acronym)"
                        (keyup.enter)="deleteModule($event, module.acronym)">
                        <i class="icon bi bi-x-lg text-gray"></i>
                    </button>
                </mat-card>
            </div>
        </div>
    </div>
</ng-container>


<ng-template #noData>
    <mat-card appearance="outlined" class="my-3 p-4">
        <app-no-data noDataMessage="Keine Module vorhanden." [diagram]="false"></app-no-data>
    </mat-card>
</ng-template>
