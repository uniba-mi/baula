<!-- .min-vh-200 gives the sticky-chart block room to scroll within; without it,
     a sticky element with a short containing block has nowhere to "stick" -->
<div class="min-vh-200">
  <div class="sticky-chart">
    <div id="bar-chart">
      <reporting-echarts-host [option]="option" (chartClick)="onChartClick($event)"></reporting-echarts-host>
    </div>
    <div class="legend">
      <span class="legend-item">
        <span class="legend-swatch" style="background: var(--ub-blue)"></span>
        <span class="legend-text" i18n>Aktueller Wert</span>
      </span>
      @if (hasSelection) {
        <span class="legend-item">
          <span class="legend-swatch" style="background: var(--ub-red)"></span>
          <span class="legend-text" i18n>Ausgewählt</span>
        </span>
      }
      @if ((unit$ | async) == 'ects') {
        <span class="legend-item">
          <span class="legend-line"></span>
          <span class="legend-text" i18n>Dein Zielwert</span>
        </span>
      }
    </div>
  </div>
  <!-- hr to separate the charts -->
  <hr class="visibility" size="10" width="85%">
</div>
