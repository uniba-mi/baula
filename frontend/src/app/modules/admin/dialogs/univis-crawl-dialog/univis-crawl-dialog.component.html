<ng-container role="Dialogfenster" aria-label="Dialogfenster">
  @if (univisCrawl$ | async; as messages) {
    <div>
      @for (message of messages.logs; track message) {
        <div>
          <i class="text-success bi bi-check-lg"></i>
          {{ message }}
        </div>
      }
      @if (messages.detailLog.length > 0) {
        <mat-accordion>
          <mat-expansion-panel>
            <mat-expansion-panel-header>
              <mat-panel-title> Detaillierter Log </mat-panel-title>
            </mat-expansion-panel-header>
            @for (detail of messages.detailLog; track detail) {
              <div>
                {{ detail }}
              </div>
            }
          </mat-expansion-panel>
        </mat-accordion>
      }
      <mat-dialog-actions>
        <button mat-raised-button class="btn btn-outline" mat-dialog-close>
          Abbrechen
        </button>
      </mat-dialog-actions>
    </div>
  } @else {
    <mat-spinner class="mx-auto my-4"></mat-spinner>
    <div>Don't worry... this process can take up to 10 minutes ☕</div>
  }
  <!-- Loading spinner -->
</ng-container>
