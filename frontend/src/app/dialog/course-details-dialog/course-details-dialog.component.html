<ng-container role="Dialoginhalt">
  <div class="container my-4">
    <app-course-details [course]="course" [context]="'detail-dialog'"></app-course-details>
  </div>
  <mat-dialog-actions>
    @if (deselectOption) {
      <button mat-raised-button class="btn btn-danger" [mat-dialog-close]="course" i18n>
        Lehrveranstaltung abwählen
      </button>
    }
    <button mat-raised-button class="btn btn-outline" mat-dialog-close i18n>
      Schließen
    </button>
  </mat-dialog-actions>
</ng-container>
