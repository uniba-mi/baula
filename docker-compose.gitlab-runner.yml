services:
  gitlab-runner:
    build:
      context: ./CICD/
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:8000"
      - "5001:80"
      - "5002:443"
      - "5003:27017"
      - "5004:6379"
      - "5005:3306"
      - "5006:1234"
      - "5007:3305"
      - "5008:4201"
      - "5009:4202"
    volumes: 
      # - ./:/home/baula
      - /etc/acme/rsa-certs:/etc/acme/rsa-certs
      - /var/run/docker.sock:/var/run/docker.sock
      # From docker-compose.server.yml
      - ./server/app:/server/app 
      - ./documentation/user-docs/.retype:/var/www/docs/user
      - ./documentation/developer-docs/.retype:/var/www/docs/developer
      - ./server/apache2/sites-available:/etc/apache2/sites-available   
      # - /etc/acme/rsa-certs:/etc/acme/rsa-certs
      # From docker-compose.yml
      - ./data/backups/mariadb:/backups
      - ./data/mariadb:/var/lib/mysql
    # From docker-compose.yml
    environment:
      - MYSQL_ROOT_PASSWORD=${RELDB_ROOT_PW}
      - MYSQL_PASSWORD=${RELDB_PASSWORD}
      - MYSQL_DATABASE=${RELDB_DATABASE}
      - MYSQL_USER=${RELDB_USER}
    user: root
  
  server:
    build:
      context: ./server/
      dockerfile: Dockerfile
    restart: always   
    environment:
      - HOST_URL=${HOST_URL}
      - HOSTNAME=${HOSTNAME}
      - API_PORT=${API_PORT} 
    ports:    
      - "${LOCAL_IP}:${SERVER_PORT}:80"
      - "${LOCAL_IP}:${SERVER_PORT_SSL}:443"
    volumes:
      - ./server/app:/var/www   
      - ./documentation/user-docs/.retype:/var/www/docs/user
      - ./documentation/developer-docs/.retype:/var/www/docs/developer
      - ./server/apache2/sites-available:/etc/apache2/sites-available   
      - /etc/acme/rsa-certs:/etc/acme/rsa-certs

  rest_api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./backend/api/dist/backend/api:/api
      - ./backend/api/dist/interfaces:/interfaces
    ports:    
      - "${LOCAL_IP}:${API_PORT}:3305"
