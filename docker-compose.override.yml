services:
  mongodb:
    ports:
      - 27017:27017
  
  mariadb:
    ports: 
      - 3306:3306

  redis:
    ports:
      - 6379:6379

  python:
    ports: 
      - 8000:8000

  retype:
    image: retypeapp/retype:latest
    restart: always
    command: >
      retype start /docs --host 0.0.0.0 --port 4201
    volumes:
      - ./documentation:/docs
    ports:
      - ${DOCS_PORT}:4201
